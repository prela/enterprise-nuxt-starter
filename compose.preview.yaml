# Playground + PostgreSQL on Coolify (preview from `develop`).
# Coolify's proxy routes to playground:3000. Do not publish host ports: that would
# expose PostgreSQL and bypass the proxy. Local topology stays in compose.yaml.

services:
  postgres:
    image: postgres:16-alpine
    # Stable DNS for the Playground even if Coolify rewrites the compose service name.
    hostname: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10

  playground:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - '3000'
    environment:
      # Present so Coolify generates the public URL for port 3000. Do not assign
      # an empty default; that would wipe the value Coolify injects.
      - SERVICE_URL_PLAYGROUND_3000
      # Must be the public HTTPS origin (same host the owner opens). Identity cookies
      # and Better Auth trusted origins follow this value.
      - NUXT_PUBLIC_SITE_URL=${NUXT_PUBLIC_SITE_URL}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NUXT_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NUXT_BETTER_AUTH_SECRET=${NUXT_BETTER_AUTH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
