# Playground + PostgreSQL on Coolify (preview from `develop`).
# Coolify's proxy routes to playground:3000. Do not publish host ports: that would
# expose PostgreSQL and bypass the proxy. Local topology stays in compose.yaml.

services:
  postgres:
    image: postgres:16-alpine
    # Stable DNS for the Playground even if Coolify rewrites the compose service name.
    hostname: postgres
    # Coolify writes UI env to `.env`. Load it instead of
    # `POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}` — Coolify has emptied those
    # same-name mappings (coollabsio/coolify#9136). Do not interpolate
    # `${POSTGRES_USER}` on this service: Coolify then injects
    # `POSTGRES_USER: null` and unsets the env_file value.
    env_file:
      - .env
    environment:
      # Coolify 4.3.11 only copies UI secrets onto a service when they appear
      # under environment: (Show deployable compose had none). env_file .env
      # did not carry POSTGRES_PASSWORD, so postgres exited: "superuser password
      # is not specified." Name-only keys (same as SERVICE_URL_PLAYGROUND_3000)
      # let Coolify inject. Do not write KEY: ${KEY} — that is #9136.
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - postgres-data:/var/lib/postgresql/data

  playground:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - '3000'
    env_file:
      - .env
    environment:
      # Present so Coolify generates the public URL for port 3000. Do not assign
      # an empty default; that would wipe the value Coolify injects.
      - SERVICE_URL_PLAYGROUND_3000
      # NUXT_PUBLIC_SITE_URL and NUXT_BETTER_AUTH_SECRET come from env_file
      # (Coolify UI). Same-name `KEY=${KEY}` list items would be emptied.
      # Combined strings (not `KEY=${KEY}`) so Coolify #9136 cannot empty them.
      # Host inside the Compose network must be `postgres`, not localhost.
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NUXT_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    # Coolify 4.3.11 injects `POSTGRES_USER: null` on postgres when that service
    # interpolates `${POSTGRES_USER}` (Show deployable compose). That unsets
    # env_file's user, so `pg_isready` never passes and `service_healthy` fails
    # `docker compose up -d`. Playground `/ready` waits for Identity's engine.
    depends_on:
      - postgres

volumes:
  postgres-data:
